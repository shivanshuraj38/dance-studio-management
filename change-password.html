<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="css/style.css">

    <title>Change Password | Dance Studio</title>
</head>

<body>

    <header>

        <nav>

            <h2>Dance Studio</h2>

            <ul>
                <li><a href="login.html" class="dashboard-link">Dashboard</a></li>
                <li><a href="#" onclick="logoutUser()">Logout</a></li>
            </ul>

        </nav>

    </header>


    <main class="account-page">

        <section class="auth-container">

            <h1>Change Password</h1>

            <p>
                Enter your current password, then choose a new one.
            </p>


            <form onsubmit="handleChangePassword(event)">

                <div>

                    <label for="currentPassword">Current Password</label>

                    <input
                        type="password"
                        id="currentPassword"
                        placeholder="Enter your current password"
                        autocomplete="current-password"
                        required
                    >

                </div>

                <div>

                    <label for="newPassword">New Password</label>

                    <input
                        type="password"
                        id="newPassword"
                        placeholder="At least 6 characters"
                        minlength="6"
                        autocomplete="new-password"
                        required
                    >

                </div>

                <div>

                    <label for="confirmNewPassword">Confirm New Password</label>

                    <input
                        type="password"
                        id="confirmNewPassword"
                        placeholder="Re-enter the new password"
                        minlength="6"
                        autocomplete="new-password"
                        required
                    >

                </div>

                <button type="submit">Change Password</button>

            </form>


            <p>
                <a href="login.html" class="dashboard-link">Back to dashboard</a>
            </p>

        </section>

    </main>


    <footer>

        <p>
            &copy; 2026 Dance Studio Management System
        </p>

    </footer>


    <!-- JavaScript -->
    <script src="js/data.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/password.js"></script>

    <script>

        setupChangePasswordPage();

    </script>

</body>

</html>
